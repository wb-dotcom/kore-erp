<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="none">
  <defs>
    <linearGradient id="grad" x1="100" y1="0" x2="100" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="55%" stop-color="#7b52e8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Crown -->
  <g fill="url(#grad)">
    <!-- Crown base arc -->
    <path d="M68 54 Q100 30 132 54" stroke="url(#grad)" stroke-width="10" fill="none" stroke-linecap="round"/>
    <!-- Crown bumps -->
    <circle cx="100" cy="28" r="9"/>
    <circle cx="76"  cy="38" r="7"/>
    <circle cx="124" cy="38" r="7"/>
  </g>

  <!-- Outer ring -->
  <circle cx="100" cy="130" r="88" stroke="url(#grad)" stroke-width="10" fill="none"/>
  <!-- Inner ring -->
  <circle cx="100" cy="130" r="72" stroke="url(#grad)" stroke-width="5" fill="none"/>

  <!-- K5 text -->
  <text x="100" y="155"
        font-family="'Arial Black', Arial, sans-serif"
        font-weight="900"
        font-size="72"
        text-anchor="middle"
        fill="url(#grad)"
        letter-spacing="-4">K5</text>
</svg>
